PACKAGE_NAME="83hl-drivers"
PACKAGE_VERSION="1.0"
# 83HL (X1P42100): iris + videocc (backport purwa v7) e qcom-hamoa-ec (EC ventola) per kernel Ubuntu 7.0
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="qcom-iris"
BUILT_MODULE_LOCATION[0]="iris/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="videocc-x1p42100"
BUILT_MODULE_LOCATION[1]="clk/"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
# solo serie 7.0: con kernel che includono già X1P42100 non serve
BUILD_EXCLUSIVE_KERNEL="^7\.0\."
BUILT_MODULE_NAME[2]="qcom-hamoa-ec"
BUILT_MODULE_LOCATION[2]="ec/"
DEST_MODULE_LOCATION[2]="/updates/dkms"
